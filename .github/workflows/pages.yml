name: Deploy GitHub Pages (manual approval)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate:data
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_BASE_PATH: /NuclearAstrophysics-Lab/
      - run: node scripts/make-standalone.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy after explicit workflow dispatch
        id: deployment
        uses: actions/deploy-pages@v4
